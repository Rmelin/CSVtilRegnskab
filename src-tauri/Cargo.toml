[package]
name = "forening-regnskab"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "macros", "rust_decimal"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
csv = "1"
regex = "1"
thiserror = "1"
printpdf = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
encoding_rs = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }
